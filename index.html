<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Статблоки</title>
  <style>
    :root {
      --bg: #222639; --paper: #2c3047; --text: #fff; --text-2: rgba(255,255,255,.7);
      --primary: #bb99ff; --primary-text: #000; --line: rgba(127,127,127,.3);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
    #app { padding: 12px; }
    h2 { font-size: 17px; margin: 10px 0 2px; }
    h3 { font-size: 14px; margin: 16px 0 4px; }
    p { margin: 0 0 8px; }
    .hint { color: var(--text-2); font-size: 12px; }

    .toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .spacer { flex: 1; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .btn { border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px;
      background: var(--paper); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
    .btn:hover { filter: brightness(1.15); }
    .btn.primary { background: var(--primary); color: var(--primary-text); box-shadow: none; font-weight: 600; }
    .btn.danger { background: #c0392b; color: #fff; box-shadow: none; }
    .btn:focus-visible, .card:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

    input[type=text], input[type=search], select, textarea {
      width: 100%; margin-bottom: 8px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--paper); color: var(--text); font: inherit; }
    input[type=file] { width: 100%; margin-bottom: 8px; color: var(--text-2); }
    textarea { resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    textarea.editor { min-height: 320px; }
    textarea.paste { min-height: 90px; }

    .results { display: flex; flex-direction: column; gap: 4px; }
    .group { margin: 10px 2px 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); }
    .card { text-align: left; border: 0; border-radius: 8px; padding: 10px 12px; cursor: pointer;
      background: var(--paper); color: var(--text); font-size: 14px; }
    .card:hover { filter: brightness(1.15); }
    .empty { color: var(--text-2); text-align: center; padding: 20px 8px; }
    .banner { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px;
      margin-bottom: 8px; border-radius: 8px; background: var(--primary); color: var(--primary-text); font-weight: 600; }
    .banner .btn { padding: 4px 10px; }

    .title { margin-top: 4px; }
    .sub { color: var(--text-2); font-size: 12px; margin-bottom: 6px; }
    .sb { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--paper); line-height: 1.45; }
    .sb h1, .sb h2, .sb h3, .sb h4 { margin: 12px 0 4px; line-height: 1.2; }
    .sb h1 { font-size: 18px; } .sb h2 { font-size: 15px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
    .sb h3 { font-size: 14px; } .sb h4 { font-size: 13px; }
    .sb p { margin: 6px 0; } .sb ul { margin: 6px 0; padding-left: 20px; }
    .sb hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
    .sb table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
    .sb th, .sb td { padding: 3px 6px; text-align: left; border-bottom: 1px solid var(--line); }
    .gm-only { text-align: center; padding: 30px 10px; color: var(--text-2); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popover.bundle.js"></script>
</body>
</html>
